<nav class="bg-indigo-700 text-white">
  <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
    <a routerLink="/" class="font-bold text-lg mr-auto">InventaPyme</a>
    <a routerLink="/" routerLinkActive="underline" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="underline">Catálogo</a>

    @if (inventario.usuario()?.rol === 'admin') {
      <a routerLink="/productos" routerLinkActive="underline">Productos</a>
    }

    @if (inventario.usuario(); as u) {
      <span class="text-sm opacity-80">{{ u.nombre }} ({{ u.rol }})</span>
      <button class="bg-white text-indigo-700 px-3 py-1 rounded" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login" class="bg-white text-indigo-700 px-3 py-1 rounded">Entrar</a>
    }
  </div>
</nav>

<main class="max-w-5xl mx-auto p-4">
  <router-outlet />
</main>
